site_name: "Poyo's Reference Fixer"
site_url: https://ghp.maaaaa.net/Ref-Fixer/
repo_url: https://github.com/Poyotoron/Ref-Fixer
site_dir: site

theme:
  name: material
  language: ja
  custom_dir: overrides
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークテーマに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトテーマに切り替える

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  package_version: !ENV [PACKAGE_VERSION, dev]

nav:
  - はじめに: index.md
  - インストール: install.md
  - クイックスタート: quickstart.md
  - Force Text への変換: serialization.md
  - 検査: inspect.md
  - 結果の読み方: results.md
  - 候補を探す:
      - プロジェクト内から探す: search-project.md
      - .unitypackage から探す: search-unitypackage.md
      - ごみ箱から探す: search-trash.md
  - 修復: repair.md
  - まとめて検査: batch.md
  - バックアップとログ: backup.md
  - 困ったときは: troubleshooting.md
  - 更新履歴: changelog.md
